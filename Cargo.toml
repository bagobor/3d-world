[package]
name = "planet-sim"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Procedural 3D planet simulator tech demo (Bevy + wgpu, GPU compute simulation)"

[dependencies]
bevy = "0.20.1"
bytemuck = { version = "1", features = ["derive"] }

# Dependencies get full optimisation even in dev builds; our own crate stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
# Bevy systems routinely take many parameters and complex query types.
too_many_arguments = "allow"
type_complexity = "allow"
