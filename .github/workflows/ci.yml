name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (Bevy + Mesa software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Compiles every compute and material shader, generates a small planet on a CPU Vulkan
      # driver (lavapipe) and saves it to the cache, then starts again and must load it.
      - name: Headless generation smoke test
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo run -- --headless --generation-steps 256 --generation-steps-per-frame 32 \
            --resolution 256 --cache cache --out out 2>&1 | tee generate.log
          grep -q "sim cache: saved planet" generate.log
          cargo run -- --headless --resolution 256 --cache cache --out out/reloaded 2>&1 \
            | tee reload.log
          grep -q "sim cache: loaded planet" reload.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-output
          path: out/
